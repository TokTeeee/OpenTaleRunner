<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#d1d5db;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex}
nav{width:220px;min-height:100vh;background:#08080f;border-right:1px solid #1f1f2e;padding:20px 0;flex-shrink:0;position:sticky;top:0}
nav .logo{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#818cf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:0 16px 20px}
nav a{display:flex;align-items:center;gap:8px;padding:10px 16px;color:#9ca3af;text-decoration:none;font-size:.85rem;transition:all .15s;border-left:3px solid transparent}
nav a:hover,nav a.active{color:#e2e8f0;background:#111119;border-left-color:#6366f1}
nav a .icon{font-size:1.1rem;width:20px;text-align:center}
main{flex:1;padding:24px;overflow-y:auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h2{font-size:1.4rem;color:#e2e8f0}
.world-day{background:#312e81;color:#c7d2fe;padding:4px 14px;border-radius:20px;font-size:.85rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.card{background:#111119;border:1px solid #1f1f2e;border-radius:12px;padding:16px;transition:border-color .2s}
.card:hover{border-color:#312e81}
.card .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin-bottom:6px}
.card .value{font-size:1.7rem;font-weight:700;color:#e2e8f0}
.card .sub{font-size:.72rem;color:#4b5563;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:10px 12px;color:#6b7280;font-weight:500;font-size:.7rem;text-transform:uppercase;border-bottom:1px solid #1f1f2e}
td{padding:10px 12px;border-bottom:1px solid #0d0d15;color:#d1d5db}
tr:hover td{background:#111119}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.65rem;font-weight:600}
.badge-green{background:#064e3b;color:#6ee7b7}
.badge-blue{background:#1e3a5f;color:#93c5fd}
.badge-amber{background:#78350f;color:#fcd34d}
.badge-gray{background:#1f1f2e;color:#6b7280}
.chron-item{padding:12px 0;border-bottom:1px solid #1f1f2e}
.chron-day{font-size:.7rem;color:#6366f1;font-weight:600}
.chron-title{font-size:.9rem;color:#e2e8f0;font-weight:500;margin:4px 0}
.chron-text{font-size:.78rem;color:#9ca3af;line-height:1.7}
.npc-row{display:flex;align-items:center;gap:10px}
.npc-avatar{width:28px;height:28px;border-radius:8px;background:#312e81;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#c7d2fe;flex-shrink:0}
.clickable{cursor:pointer}
.clickable:hover{color:#a5b4fc}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#111119;border:1px solid #1f1f2e;border-radius:16px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid #1f1f2e;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{color:#e2e8f0}
.modal-body{padding:20px;font-size:.85rem;line-height:1.8}
.modal-body .section{margin-bottom:16px}
.modal-body .section-label{font-size:.7rem;color:#6366f1;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.tooltip-map{position:absolute;background:#1e1b4b;border:1px solid #6366f1;border-radius:8px;padding:8px 12px;font-size:.75rem;color:#e2e8f0;pointer-events:none;z-index:50;max-width:280px;box-shadow:0 4px 20px rgba(0,0,0,.6);display:none}
.tooltip-map .tt-name{font-weight:700;font-size:.82rem;color:#c7d2fe;margin-bottom:2px}
.tooltip-map .tt-type{font-size:.68rem;color:#818cf8;margin-bottom:2px}
.tooltip-map .tt-desc{font-size:.7rem;color:#9ca3af;line-height:1.4}
.tooltip-map .tt-coord{font-size:.65rem;color:#6b7280;margin-top:4px}
.coord-display{position:absolute;bottom:12px;right:16px;background:#08080fcc;border:1px solid #1f1f2e;border-radius:6px;padding:4px 10px;font-size:.68rem;color:#6b7280;font-family:monospace;pointer-events:none;z-index:40}
.legend-box{position:absolute;top:12px;right:16px;background:rgba(20,20,30,.9);border:1px solid #1f1f2e;border-radius:8px;padding:10px 12px;z-index:40;font-size:.65rem}
.legend-box .leg-item{display:flex;align-items:center;gap:6px;color:#9ca3af;margin-bottom:3px}
.legend-box .leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.map-controls{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;z-index:40}
.map-controls button{width:28px;height:28px;background:rgba(20,20,30,.9);border:1px solid #1f1f2e;border-radius:6px;color:#9ca3af;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.map-controls button:hover{color:#e2e8f0;border-color:#6366f1}
.bar{height:6px;border-radius:3px;background:#1f1f2e;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:3px}
.fade{opacity:.5}
@media(max-width:768px){nav{width:60px}nav a span{display:none}nav .logo{font-size:.8rem;text-align:center}}
</style>
</head>
<body>
<nav id="nav">
  <div class="logo" id="worldLogo">世界看板</div>
  <a href="#" data-page="overview" class="active"><span class="icon">🏠</span><span>概览</span></a>
  <a href="#" data-page="regions"><span class="icon">🗺️</span><span>区域</span></a>
  <a href="#" data-page="adventurers"><span class="icon">⚔️</span><span>冒险者</span></a>
  <a href="#" data-page="npcs"><span class="icon">👥</span><span>NPC</span></a>
  <a href="#" data-page="chronicle"><span class="icon">📜</span><span>编年史</span></a>
  <a href="#" data-page="events"><span class="icon">⚡</span><span>事件</span></a>
  <a href="#" data-page="story"><span class="icon">📖</span><span>故事线</span></a>
  <a href="#" data-page="map"><span class="icon">🌍</span><span>世界地图</span></a>
</nav>
<main><div class="header"><h2 id="pageTitle">概览</h2><span class="world-day" id="worldDay">世界日 --</span></div><div id="content">加载中...</div></main>
<div class="modal-overlay" id="modal" style="display:none"><div class="modal"><div class="modal-header"><h3 id="modalTitle"></h3><button onclick="closeModal()" style="background:none;border:none;color:#6b7280;font-size:1.2rem;cursor:pointer">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>

<script>
const API = 'http://' + window.location.hostname + ':8000';
const STATS = '';  // same origin (dashboard on 8081)

let currentPage='overview', worldDay=0;
let cachedOverview=null, cachedRegions=null, cachedNpcs=null, cachedChronicle=null, cachedTimeline=null, cachedEvents=null, cachedActivity=null, cachedMap=null, cachedWaters=null, cachedRoads=null, cachedAliases=null, cachedMapEntities=null;

let mapDay = 99999;
const rname = id => (cachedAliases?.regions?.[id]) || id;
const tname = t => (cachedAliases?.terrains?.[t]) || t;

async function refresh(){
  try{
    const batches = [
      fetch(STATS+'/api/stats/overview').then(r=>r.json()),
      fetch(STATS+'/api/stats/regions').then(r=>r.json()),
      fetch(STATS+'/api/stats/npcs?limit=200').then(r=>r.json()),
      fetch(STATS+'/api/stats/chronicle?limit=50').then(r=>r.json()),
      fetch(STATS+'/api/stats/timeline').then(r=>r.json()),
      fetch(STATS+'/api/stats/events?limit=200').then(r=>r.json()),
      fetch(STATS+'/api/stats/activity').then(r=>r.json()),
      fetch(API+'/api/v1/world/map?world_day='+(mapDay||99999)).then(r=>r.json()),
      fetch(STATS+'/api/stats/waters').then(r=>r.json()),
      fetch(STATS+'/api/stats/roads').then(r=>r.json()),
      fetch(API+'/api/v1/world/aliases').then(r=>r.json()),
      fetch(STATS+'/api/stats/map-entities').then(r=>r.json()),
    ];
    const r=await Promise.all(batches);
    cachedOverview=r[0]; cachedRegions=r[1]; cachedNpcs=r[2];
    cachedChronicle=r[3]; cachedTimeline=r[4]; cachedEvents=r[5];
    cachedActivity=r[6]; cachedMap=r[7]; cachedWaters=r[8]; cachedRoads=r[9];
    cachedAliases=r[10]; cachedMapEntities=r[11];
    worldDay=r[0].world_day||0;
    const worldName = r[0].world_name || '当前世界';
    document.title = worldName + ' · 世界看板';
    document.getElementById('worldLogo').textContent = worldName + ' 看板';
    document.getElementById('worldDay').textContent='世界日 '+worldDay;
    renderPage();
  }catch(e){document.getElementById('content').innerHTML='<div class="card" style="color:#f87171">无法连接到看板服务</div>'}
}

function renderPage(){
  const c=document.getElementById('content');
  switch(currentPage){
    case'overview':renderOverview(c);break;
    case'regions':renderRegions(c);break;
    case'adventurers':renderAdventurers(c);break;
    case'npcs':renderNPCs(c);break;
    case'chronicle':renderChronicle(c);break;
    case'events':renderEvents(c);break;
    case'story':renderStory(c);break;
    case'map':renderMap(c);break;
  }
}

function renderOverview(c){
  const ov=cachedOverview||{};
  document.getElementById('pageTitle').textContent='概览';
  c.innerHTML=`
    <div class="grid">
      <div class="card"><div class="label">区域</div><div class="value">${(ov.regions||[]).length}</div></div>
      <div class="card"><div class="label">冒险者</div><div class="value">${ov.total_players||0}</div><div class="sub">注册 / 活跃: ${ov.active_players_2h||0}</div></div>
      <div class="card"><div class="label">NPC</div><div class="value">${ov.total_npcs||0}</div><div class="sub"><span style="color:#6ee7b7">${ov.promoted_npcs||0}</span> 已升格</div></div>
      <div class="card"><div class="label">编年史</div><div class="value">${ov.total_chronicle_entries||0}</div></div>
    </div>
    <div class="grid">
      <div class="card"><div class="label">区域活跃度</div>
        ${(ov.regions||[]).map(r=>`<div style="margin:8px 0;font-size:.8rem;display:flex;justify-content:space-between"><span>${rname(r.id)}</span><span style="color:#6b7280">${r.character_count||0} 角色</span></div><div class="bar"><div class="bar-fill" style="width:${Math.max(2,(r.character_count||0)/(Math.max(1,...(ov.regions||[]).map(x=>x.character_count||0)))*100)}%;background:linear-gradient(90deg,#6366f1,#818cf8)"></div></div>`).join('')}
      </div>
      <div class="card"><div class="label">里程碑</div>
        ${(ov.milestones||[]).map(m=>{const sc={'completed':'#6ee7b7','active':'#fbbf24','unlocked':'#93c5fd','pending':'#6b7280','locked':'#374151'};return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.8rem"><span style="width:8px;height:8px;border-radius:50%;background:${sc[m.status]||'#374151'}"></span>${m.name}<span style="margin-left:auto;font-size:.7rem;color:${sc[m.status]||'#6b7280'}">${m.status}</span></div>`}).join('')||'<div class="fade" style="font-size:.8rem">暂无</div>'}
      </div>
    </div>
    ${renderActivityBlock()}
  `;
}

function renderActivityBlock(){
  const acts=cachedActivity||[];
  if(!acts.length) return '<div class="card" style="margin-top:16px;color:#6b7280;text-align:center;padding:20px;font-size:.8rem">活跃玩家：等待编年史上报</div>';
  const byRegion={}; acts.forEach(a=>{byRegion[a.region]=(byRegion[a.region]||0)+1});
  return `<div class="card" style="margin-top:16px"><div class="label">活跃玩家 (24h)</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">${Object.entries(byRegion).map(([r,c])=>`<span class="badge badge-blue" style="font-size:.75rem">${rname(r)}: ${c}人</span>`).join('')}</div>
    <table><thead><tr><th>角色</th><th>区域</th><th>坐标</th><th>世界日</th><th>最近活跃</th></tr></thead><tbody>
    ${acts.slice(0,20).map(a=>`<tr><td>${a.character_name}</td><td>${rname(a.region)} ${a.sub_region||''}</td><td style="font-size:.7rem;color:#6b7280">${a.coordinates?`(${a.coordinates.x},${a.coordinates.y},${a.coordinates.z})`:''}</td><td>${a.world_day}</td><td style="font-size:.7rem;color:#6b7280">${(a.last_active||'').slice(11,19)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

function renderRegions(c){
  document.getElementById('pageTitle').textContent='区域';
  const regs=cachedRegions||[];
  if(!regs.length){c.innerHTML='<div class="card" style="color:#6b7280;text-align:center;padding:32px">暂无区域数据</div>';return}
  c.innerHTML=`<table><thead><tr><th>区域</th><th>天气</th><th>角色数</th><th>NPC数</th><th>近期事件</th></tr></thead><tbody>
    ${regs.map(r=>`<tr><td>${rname(r.region_id)}</td><td>${r.weather||'晴朗'}</td><td>${r.character_count||0}</td><td>${r.npc_count||0}</td><td>${(r.current_events||[]).slice(0,2).map(e=>`<span class="badge badge-amber" style="margin:1px">${e}</span>`).join(' ')||'<span class="fade">--</span>'}</td></tr>`).join('')}
    </tbody></table>`;
}

function renderAdventurers(c){
  document.getElementById('pageTitle').textContent='冒险者';
  const ov=cachedOverview||{};
  c.innerHTML=`
    <div class="grid">
      <div class="card"><div class="label">总注册</div><div class="value">${ov.total_players||0}</div></div>
      <div class="card"><div class="label">总角色</div><div class="value">${ov.total_characters||0}</div></div>
      <div class="card"><div class="label">日志</div><div class="value">${ov.total_chronicle_entries||0}</div></div>
      <div class="card"><div class="label">2h活跃</div><div class="value" style="color:#6ee7b7">${ov.active_players_2h||0}</div></div>
    </div>
    <div class="card" style="margin-top:16px"><div class="label">区域分布</div>
      ${(ov.regions||[]).map(r=>`<div style="margin:10px 0;font-size:.82rem;display:flex;justify-content:space-between"><span>${rname(r.id)}</span><span style="color:#6b7280">${r.character_count||0} 位 · ${r.weather||''}</span></div><div class="bar"><div class="bar-fill" style="width:${Math.max(2,(r.character_count||0)/(Math.max(1,...(ov.regions||[]).map(x=>x.character_count||0)))*100)}%;background:linear-gradient(90deg,#6366f1,#a78bfa)"></div></div>`).join('')}
    </div>
    ${renderActivityBlock()}`;
}

function renderNPCs(c){
  document.getElementById('pageTitle').textContent='NPC';
  const npcs=cachedNpcs||[];
  if(!npcs.length){c.innerHTML='<div class="card" style="color:#6b7280;text-align:center;padding:32px">暂无NPC</div>';return}
  c.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="label">筛选</div>
    ${[{k:'all',l:'全部',c:'badge-blue'},{k:'promoted',l:'已升格',c:'badge-green'},{k:'storybook',l:'故事书',c:'badge-blue'},{k:'client_created',l:'玩家创建',c:'badge-amber'}].map(f=>`<button onclick="filterNpcs('${f.k}')" class="badge ${f.c}" style="margin:2px;cursor:pointer;font-size:.72rem">${f.l}</button>`).join('')}
  </div>
  <table id="npcTable"><thead><tr><th>名称</th><th>区域</th><th>来源</th><th>交互</th><th>状态</th></tr></thead><tbody>
    ${npcs.map(n=>`<tr class="clickable" onclick="showNPCDetail('${n.npcId}')"><td><div class="npc-row"><div class="npc-avatar">${n.name[0]}</div>${n.name}</div></td><td>${rname(n.region)}</td><td>${n.source||'--'}</td><td>${n.total_interactions||0}</td><td>${n.promoted?'<span class="badge badge-green">已升格</span>':'<span class="badge badge-gray">普通</span>'}</td></tr>`).join('')}
  </tbody></table>`;
}
window.filterNpcs=function(type){
  const all=cachedNpcs||[];
  const f=type==='all'?all:type==='promoted'?all.filter(n=>n.promoted):all.filter(n=>n.source===type);
  document.getElementById('npcTable').querySelector('tbody').innerHTML=f.map(n=>`<tr class="clickable" onclick="showNPCDetail('${n.npcId}')"><td><div class="npc-row"><div class="npc-avatar">${n.name[0]}</div>${n.name}</div></td><td>${n.region}</td><td>${n.source||'--'}</td><td>${n.total_interactions||0}</td><td>${n.promoted?'<span class="badge badge-green">已升格</span>':'<span class="badge badge-gray">普通</span>'}</td></tr>`).join('');
};
window.showNPCDetail=function(npcId){
  const n=(cachedNpcs||[]).find(x=>x.npcId===npcId);
  document.getElementById('modalTitle').textContent=n?n.name:'NPC';
  document.getElementById('modalBody').innerHTML=n?`<div class="section"><div class="section-label">基础</div>区域: ${rname(n.region)} · ${n.promoted?'<span class="badge badge-green">已升格</span>':'<span class="badge badge-gray">普通</span>'} · 总交互: ${n.total_interactions||0}</div>`:'暂无信息';
  document.getElementById('modal').style.display='flex';
};

function renderChronicle(c){
  document.getElementById('pageTitle').textContent='编年史';
  const chr=cachedChronicle||[];
  if(!chr.length){c.innerHTML='<div class="card" style="color:#6b7280;text-align:center;padding:32px">世界还在等待第一个故事</div>';return}
  c.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="label">筛选</div>
    <select onchange="filterChronicle(this.value)" style="background:#1f1f2e;color:#d1d5db;border:1px solid #2d2d3f;border-radius:8px;padding:6px 10px;font-size:.8rem;margin:4px">
      <option value="all">全部</option>${[...new Set(chr.map(c=>c.region))].map(r=>`<option value="${r}">${r}</option>`).join('')}
    </select></div>
  <div id="chronList">${chr.map(c=>`<div class="chron-item"><div class="chron-day">世界日 ${c.worldDay} · ${c.region}</div><div class="chron-title">${c.title||''}</div><div class="chron-text">${(c.narrative||'').slice(0,300)}</div></div>`).join('')}</div>`;
}
window.filterChronicle=function(region){
  const all=cachedChronicle||[];
  const f=region==='all'?all:all.filter(c=>c.region===region);
  document.getElementById('chronList').innerHTML=f.map(c=>`<div class="chron-item"><div class="chron-day">世界日 ${c.worldDay} · ${c.region}</div><div class="chron-title">${c.title||''}</div><div class="chron-text">${(c.narrative||'').slice(0,300)}</div></div>`).join('');
};

function renderEvents(c){
  document.getElementById('pageTitle').textContent='事件';
  const evts=cachedEvents||[];
  const lb={'Major':'<span class="badge badge-green">重大</span>','Late':'<span class="badge badge-amber">后期</span>','Mid':'<span class="badge badge-blue">中期</span>','Early':'<span class="badge badge-gray">前期</span>','Minor':'<span class="badge badge-gray" style="opacity:.6">微</span>'};
  const sc={'completed':'#6ee7b7','active':'#fbbf24','discovered':'#93c5fd','available':'#6b7280','locked':'#374151'};
  if(!evts.length){c.innerHTML='<div class="card" style="color:#6b7280;text-align:center;padding:32px">暂无事件</div>';return}
  c.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="label">筛选</div>
    ${[{k:'all',l:'全部'},{k:'Major',l:'重大',c:'badge-green'},{k:'Mid',l:'中期',c:'badge-blue'},{k:'Early',l:'前期',c:'badge-gray'},{k:'active',l:'进行中',c:'badge-amber'}].map(f=>`<button onclick="filterEvents('${f.k}')" class="badge ${f.c||'badge-blue'}" style="margin:2px;cursor:pointer;font-size:.72rem">${f.l}</button>`).join('')}
  </div><table id="eventTable"><thead><tr><th>事件</th><th>等级</th><th>区域</th><th>状态</th><th>发现者</th></tr></thead><tbody>
    ${evts.map(e=>{const i=e.instance,s=i?i.status:e.status;return`<tr class="clickable" onclick="showEventDetail('${e.template_id}')"><td>${e.name}</td><td>${lb[e.level]||e.level}</td><td>${rname(e.region)}</td><td><span style="color:${sc[s]||'#6b7280'}">${s==='available'?'可触发':s==='discovered'?'已发现':s==='active'?'进行中':s==='completed'?'已完成':s}</span></td><td>${i?i.discovered_by:'--'}</td></tr>`}).join('')}
  </tbody></table>`;
}
window.filterEvents=function(type){
  const all=cachedEvents||[];
  let f=type==='all'?all:type==='active'?all.filter(e=>e.instance&&(e.instance.status==='active'||e.instance.status==='discovered')):all.filter(e=>e.level===type);
  const lb={'Major':'<span class="badge badge-green">重大</span>','Late':'<span class="badge badge-amber">后期</span>','Mid':'<span class="badge badge-blue">中期</span>','Early':'<span class="badge badge-gray">前期</span>','Minor':'<span class="badge badge-gray" style="opacity:.6">微</span>'};
  const sc={'completed':'#6ee7b7','active':'#fbbf24','discovered':'#93c5fd','available':'#6b7280','locked':'#374151'};

};
window.showEventDetail=function(tid){

};

function renderMap(c) {
  document.getElementById('pageTitle').textContent = '世界地图';
  const pts = cachedMap || [], waters = cachedWaters || [], roads = cachedRoads || [];
  if (!pts.length) { c.innerHTML = '<div class="card" style="color:#6b7280;text-align:center;padding:32px">地图数据加载中...</div>'; return; }

  const allX = pts.flatMap(p => [p.x_min, p.x_max]),
    allZ = pts.flatMap(p => [p.z_min, p.z_max]);
  const minX = Math.min(...allX), maxX = Math.max(...allX),
    minZ = Math.min(...allZ), maxZ = Math.max(...allZ);

  c.innerHTML = `<div style="margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <span style="font-size:.78rem"><b>${pts.length}</b> 地点 · <b>${waters.length}</b> 水域 · <b>${roads.length}</b> 道路 · ${((maxX-minX)/1000).toFixed(0)}km × ${((maxZ-minZ)/1000).toFixed(0)}km</span>
    <span style="font-size:.78rem;color:#10b981;margin-left:4px">· 🟢 <b id="entityCountLabel">--</b> 在线</span>
    <span style="flex:1"></span>
    <label style="font-size:.72rem;color:#9ca3af;display:flex;align-items:center;gap:6px">
      截止世界日: <span id="mapDayLabel" style="color:#c7d2fe;font-weight:700;min-width:50px">${mapDay>=99999?'全部':mapDay}</span>
      <input type="range" id="mapDaySlider" min="1" max="${worldDay}" value="${mapDay>=99999?worldDay:mapDay}" style="width:120px" oninput="updateMapDay(this.value)">
      <button onclick="updateMapDay(99999)" style="background:#1f1f2e;border:1px solid #2d2d3f;color:#9ca3af;font-size:.65rem;padding:2px 6px;border-radius:4px;cursor:pointer">全部</button>
    </label>
  </div>
  <div class="card" style="position:relative;padding:0;overflow:hidden;cursor:grab;user-select:none">
    <div class="map-controls"><button onclick="mapZoom(1.5)" title="放大">+</button><button onclick="mapZoom(0.67)" title="缩小">−</button><button onclick="mapReset()" title="重置">⌂</button></div>
    <canvas id="mapCanvas" style="width:100%;height:68vh;display:block"></canvas>
    <div class="tooltip-map" id="mapTooltip"><div class="tt-name"></div><div class="tt-type"></div><div class="tt-desc"></div><div class="tt-coord"></div></div>
    <div class="coord-display" id="coordDisplay">X: 0, Z: 0</div>
    <div class="legend-box" id="legend"></div>
  </div>`;

  setTimeout(() => {
    const canvas = document.getElementById('mapCanvas'); if (!canvas) return;
    const ctx = canvas.getContext('2d'), tooltip = document.getElementById('mapTooltip'), coordDisp = document.getElementById('coordDisplay');
    const dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;

    // View state
    let zoom = Math.min(W / ((maxX - minX) * 1.05), H / ((maxZ - minZ) * 1.05)),
      cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
    const initialZoom = zoom, initialCx = cx, initialCz = cz;
    let dragging = false, dragX = 0, dragY = 0;

    function toScreen(x, z) { return [(x - cx) * zoom + W / 2 + dragX, (z - cz) * zoom + H / 2 + dragY]; }
    function toWorld(sx, sy) { return [(sx - W / 2 - dragX) / zoom + cx, (sy - H / 2 - dragY) / zoom + cz]; }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // === Layer 1: Parchment background ===
      const bgGrad = ctx.createLinearGradient(0, 0, W, H);
      bgGrad.addColorStop(0, '#e8d5b0'); bgGrad.addColorStop(0.5, '#dfcba0'); bgGrad.addColorStop(1, '#d4c4a0');
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
      // Noise texture
      ctx.fillStyle = 'rgba(139,115,85,0.03)';
      for (let i = 0; i < 500; i++) {
        const rx = Math.random() * W, ry = Math.random() * H;
        ctx.fillRect(rx, ry, 1 + Math.random() * 2, 1 + Math.random() * 2);
      }
      // Border
      ctx.strokeStyle = '#5c3d2e'; ctx.lineWidth = 4;
      ctx.strokeRect(6, 6, W - 12, H - 12);
      ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 1;
      ctx.strokeRect(10, 10, W - 20, H - 20);
      // Corner flourishes
      [[14, 14], [W - 14, 14], [14, H - 14], [W - 14, H - 14]].forEach(([fx, fy]) => {
        ctx.fillStyle = '#5c3d2e'; ctx.beginPath(); ctx.arc(fx, fy, 6, 0, Math.PI * 2); ctx.fill();
      });

      // === Layer 2: Terrain fills ===
      const bioColors = { '平原': 'rgba(200,210,180,0.5)', '都城': 'rgba(220,200,160,0.6)', '村庄': 'rgba(210,200,170,0.4)', '农田村': 'rgba(180,200,150,0.4)', '商镇': 'rgba(210,195,160,0.4)', '林边村': 'rgba(150,180,140,0.4)', '牧场村': 'rgba(200,190,150,0.4)', '采石村': 'rgba(190,180,170,0.4)', '湖畔村': 'rgba(170,200,210,0.4)', '河畔村': 'rgba(170,195,210,0.4)', '林场村': 'rgba(140,170,130,0.4)', '山脚村': 'rgba(180,175,165,0.4)', '花田村': 'rgba(220,180,200,0.4)', '关隘镇': 'rgba(200,180,170,0.4)', '原始森林': 'rgba(80,130,90,0.5)', '树冠城市': 'rgba(100,150,110,0.6)', '迷雾沼泽': 'rgba(70,100,80,0.5)', '沙漠': 'rgba(220,190,130,0.5)', '山脉': 'rgba(160,150,140,0.5)', '火山都市': 'rgba(180,140,130,0.6)', '冰原': 'rgba(200,215,230,0.5)', '要塞': 'rgba(180,190,200,0.6)', '焦土': 'rgba(160,130,140,0.5)', '魔王城堡': 'rgba(140,90,100,0.6)', '深渊裂隙': 'rgba(100,60,70,0.5)', '海洋群岛': 'rgba(140,185,205,0.5)', '港口都市': 'rgba(150,190,210,0.6)', '风暴海域': 'rgba(120,160,190,0.5)', '地热温泉': 'rgba(200,150,150,0.5)', '地下暗河': 'rgba(140,170,180,0.5)', '矿道': 'rgba(170,165,160,0.5)', '地点': 'rgba(200,195,180,0.4)' };

      // Fill biome backgrounds
      const bigBiomes = ['平原', '原始森林', '沙漠', '山脉', '海洋群岛', '冰原', '焦土'];
      pts.forEach(p => {
        if (bigBiomes.includes(p.terrain_type)) {
          const [sx1, sz1] = toScreen(p.x_min, p.z_min), [sx2, sz2] = toScreen(p.x_max, p.z_max);
          ctx.fillStyle = bioColors[p.terrain_type] || 'rgba(200,200,180,0.3)';
          ctx.fillRect(sx1, sz1, sx2 - sx1, sz2 - sz1);
        }
      });

      // === Layer 3: Water bodies ===
      waters.forEach(w => {
        const path = w.path;
        if (path.length < 2) return;
        ctx.fillStyle = w.type === 'ocean' ? 'rgba(140,190,210,0.7)' : w.type === 'lake' ? 'rgba(120,180,210,0.8)' : 'rgba(130,185,215,0.6)';
        ctx.strokeStyle = w.type === 'ocean' ? 'rgba(100,150,180,0.8)' : 'rgba(90,150,180,0.7)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const [fx, fz] = toScreen(path[0][0], path[0][1]);
        ctx.moveTo(fx, fz);
        for (let i = 1; i < path.length; i++) { const [px, pz] = toScreen(path[i][0], path[i][1]); ctx.lineTo(px, pz); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // Wave lines for oceans
        if (w.type === 'ocean' && zoom > initialZoom * 0.8) {
          ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 0.5;
          const cxW = (path[0][0] + path[2][0]) / 2, czW = (path[0][1] + path[2][1]) / 2;
          for (let wy = czW - 50000; wy < czW + 50000; wy += 15000) {
            ctx.beginPath();
            for (let wx = cxW - 300000; wx < cxW + 300000; wx += 5000) {
              const [sx, sz] = toScreen(wx, wy + Math.sin(wx / 30000) * 8000);
              wx === cxW - 300000 ? ctx.moveTo(sx, sz) : ctx.lineTo(sx, sz);
            }
            ctx.stroke();
          }
        }
        // Lake/River labels
        if (w.type !== 'ocean' && zoom > initialZoom * 1.2) {
          const [lx, lz] = toScreen(path[0][0], path[0][1]);
          ctx.fillStyle = '#3a6b7a'; ctx.font = 'italic 9px Georgia, serif'; ctx.fillText(w.name, lx + 4, lz - 4);
        }
      });

      // === Layer 4: Roads ===
      if (zoom > initialZoom * 1.3) {
        roads.forEach(r => {
          const rpath = r.path;
          if (rpath.length < 2) return;
          ctx.strokeStyle = r.type === 'major' ? 'rgba(139,90,43,0.5)' : 'rgba(139,90,43,0.3)';
          ctx.lineWidth = r.type === 'major' ? 1.5 : 0.8;
          ctx.setLineDash(r.type === 'major' ? [6, 4] : [3, 5]);
          ctx.beginPath();
          const [fx, fz] = toScreen(rpath[0][0], rpath[0][1]);
          ctx.moveTo(fx, fz);
          for (let i = 1; i < rpath.length; i++) { const [px, pz] = toScreen(rpath[i][0], rpath[i][1]); ctx.lineTo(px, pz); }
          ctx.stroke();
          ctx.setLineDash([]);
          // Road name
          if (zoom > initialZoom * 2) {
            const mid = Math.floor(rpath.length / 2);
            const [mx, mz] = toScreen(rpath[mid][0], rpath[mid][1]);
            ctx.fillStyle = '#6b4a2e'; ctx.font = '7px Georgia, serif'; ctx.fillText(r.name, mx + 3, mz - 3);
          }
        });
      }

      // === Layer 5: Terrain texture symbols (mountains, forests, desert) ===
      pts.forEach(p => {
        const [scx, scz] = toScreen((p.x_min + p.x_max) / 2, (p.z_min + p.z_max) / 2);
        if (p.terrain_type.includes('森林') || p.terrain_type === '原始森林') {
          if (zoom < initialZoom * 1.5) return;
          const step = Math.max(20, 60 / zoom * initialZoom);
          for (let tx = p.x_min + step * 10000; tx < p.x_max; tx += step * 10000) {
            for (let tz = p.z_min + step * 8000; tz < p.z_max; tz += step * 8000) {
              const [sx, sz] = toScreen(tx, tz); if (sx < -10 || sx > W + 10 || sz < -10 || sz > H + 10) continue;
              ctx.fillStyle = '#3a6040'; ctx.font = `${Math.min(14, Math.max(6, zoom * 40))}px serif`;
              ctx.fillText('\u2663', sx, sz);
            }
          }
        }
        if (p.terrain_type.includes('山脉') || p.terrain_type.includes('火山') || p.terrain_type.includes('山脚')) {
          if (zoom < initialZoom * 1.2) return;
          const step = Math.max(25, 50 / zoom * initialZoom);
          for (let tx = p.x_min + step * 12000; tx < p.x_max; tx += step * 12000) {
            for (let tz = p.z_min + step * 10000; tz < p.z_max; tz += step * 10000) {
              const [sx, sz] = toScreen(tx, tz); if (sx < -10 || sx > W + 10 || sz < -10 || sz > H + 10) continue;
              ctx.strokeStyle = '#7a6b5a'; ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(sx, sz + 6); ctx.lineTo(sx - 5, sz - 2); ctx.lineTo(sx + 5, sz - 2); ctx.closePath(); ctx.stroke();
              ctx.fillStyle = 'rgba(120,100,80,0.3)'; ctx.fill();
            }
          }
        }
        if (p.terrain_type.includes('沙漠')) {
          if (zoom < initialZoom * 1.3) return;
          const step = Math.max(30, 60 / zoom * initialZoom);
          for (let tx = p.x_min + step * 10000; tx < p.x_max; tx += step * 10000) {
            const [sx, sz] = toScreen(tx, (p.z_min + p.z_max) / 2 + Math.sin(tx / 40000) * (p.z_max - p.z_min) / 4);
            if (sx < -10 || sx > W + 10 || sz < -10 || sz > H + 10) continue;
            ctx.strokeStyle = 'rgba(180,150,100,0.4)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(sx - 8, sz + 3); ctx.quadraticCurveTo(sx, sz - 2, sx + 8, sz + 3); ctx.stroke();
          }
        }
        if (p.terrain_type === '冰原') {
          if (zoom < initialZoom * 1.3) return;
          const step = Math.max(35, 70 / zoom * initialZoom);
          for (let tx = p.x_min + step * 12000; tx < p.x_max; tx += step * 12000) {
            for (let tz = p.z_min + step * 10000; tz < p.z_max; tz += step * 10000) {
              const [sx, sz] = toScreen(tx, tz); if (sx < -10 || sx > W + 10 || sz < -10 || sz > H + 10) continue;
              ctx.strokeStyle = 'rgba(180,200,220,0.5)'; ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(sx - 6, sz); ctx.lineTo(sx, sz - 5); ctx.lineTo(sx + 6, sz); ctx.closePath(); ctx.stroke();
            }
          }
        }
      });

      // === Layer 6.5: Real-time Players & Entities ===
      const entities = (cachedMapEntities && cachedMapEntities.entities) ? cachedMapEntities.entities : [];
      const entCount = { player: 0 };
      const playerHitAreas = [];

      entities.forEach((ent, i) => {
        const [sx, sy] = toScreen(ent.x, ent.z);
        if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) return;

        if (ent.entity_type === 'player') {
          entCount.player++;
          const r = 6;

          // Pulse glow
          const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 1200 + i * 0.7);
          const glow = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, r * 2.5);
          glow.addColorStop(0, `rgba(52,211,153,${0.7 * pulse})`);
          glow.addColorStop(0.5, `rgba(16,185,129,${0.3 * pulse})`);
          glow.addColorStop(1, 'rgba(16,185,129,0)');
          ctx.fillStyle = glow;
          ctx.beginPath(); ctx.arc(sx, sy, r * 2.5, 0, Math.PI * 2); ctx.fill();

          // Outer ring
          ctx.strokeStyle = 'rgba(52,211,153,0.8)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(sx, sy, r + 1, 0, Math.PI * 2); ctx.stroke();

          // Inner dot
          ctx.fillStyle = '#10b981';
          ctx.beginPath(); ctx.arc(sx, sy, r - 1, 0, Math.PI * 2); ctx.fill();

          // White center highlight
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.beginPath(); ctx.arc(sx - 1, sy - 1, r * 0.35, 0, Math.PI * 2); ctx.fill();

          // Label on hover or zoomed in
          if (zoom > initialZoom * 1.8) {
            ctx.fillStyle = '#065f46'; ctx.font = 'bold 9px system-ui, sans-serif';
            ctx.fillText(ent.display_name, sx + r + 4, sy + 3);
            ctx.fillStyle = '#047857'; ctx.font = '8px system-ui, sans-serif';
            ctx.fillText(ent.sub_region || ent.region, sx + r + 4, sy + 14);
          }

          // Status indicator
          if (ent.current_action) {
            ctx.fillStyle = '#4ade80'; ctx.font = 'italic 7px system-ui, sans-serif';
            ctx.fillText(ent.current_action.slice(0, 16), sx + r + 4, sy + 24);
          }

          playerHitAreas.push({ ...ent, _cx: sx, _cy: sy, _r: r + 4 });
        }
        // Future: NPC entities handled here with different styling
      });
      window._playerHitAreas = playerHitAreas;
      window._entCount = entCount;

      // === Legend ===
      const ec = window._entCount || {player:0};
      const ecLabel = document.getElementById('entityCountLabel');
      if (ecLabel) ecLabel.textContent = ec.player;
      document.getElementById('legend').innerHTML = [
        ['★ 都城', '#5c3d2e'], ['● 城市/镇', '#6b4030'], ['· 村庄', '#8b6914'],
        ['🌳 森林', '#3a6040'], ['🏜 沙漠', '#c49540'], ['⛰ 山脉', '#7a6b5a'],
        ['🌊 海洋', '#8ebcd0'], ['❄ 冰原', '#b0c8e0'], ['💀 魔王领', '#8a3a4a'],
        ['🟢 在线玩家', '#10b981']
      ].map(([l, cl]) => `<div class="leg-item"><div class="leg-dot" style="background:${cl}"></div>${l}</div>`).join('');
    }

    // === Interaction ===
    canvas.addEventListener('mousemove', e => {
      const [wx, wz] = toWorld(e.offsetX, e.offsetY);
      coordDisp.textContent = `X: ${wx.toFixed(0)}m, Z: ${wz.toFixed(0)}m`;
      let found = null, foundPlayer = null;
      for (const p of pts) { if (!p._cx) continue; const dx = e.offsetX - p._cx, dy = e.offsetY - p._cz; if (Math.sqrt(dx * dx + dy * dy) < p._r) { found = p; break; } }
      // Check player entities
      const pAreas = window._playerHitAreas || [];
      for (const pe of pAreas) { const dx = e.offsetX - pe._cx, dy = e.offsetY - pe._cy; if (Math.sqrt(dx * dx + dy * dy) < pe._r) { foundPlayer = pe; break; } }
      if (foundPlayer) {
        tooltip.style.display = 'block'; tooltip.style.left = (e.offsetX + 16) + 'px'; tooltip.style.top = (Math.max(0, e.offsetY - 70)) + 'px';
        tooltip.querySelector('.tt-name').innerHTML = '\uD83D\uDFE2 ' + foundPlayer.display_name;
        tooltip.querySelector('.tt-type').textContent = (foundPlayer.sub_region || foundPlayer.region) + ' · ' + (foundPlayer.status || '在线');
        tooltip.querySelector('.tt-desc').textContent = foundPlayer.current_action || '正在冒险中';
        tooltip.querySelector('.tt-coord').textContent = `坐标: (${foundPlayer.x}, ${foundPlayer.z}) · 世界日 ${foundPlayer.world_day||''}`;
        canvas.style.cursor = 'pointer';
      } else if (found) {
        tooltip.style.display = 'block'; tooltip.style.left = (e.offsetX + 16) + 'px'; tooltip.style.top = (Math.max(0, e.offsetY - 70)) + 'px';
        tooltip.querySelector('.tt-name').textContent = found._label;
        tooltip.querySelector('.tt-type').textContent = tname(found.terrain_type) + ' · ' + rname(found.region);
        tooltip.querySelector('.tt-desc').textContent = found.description;
        tooltip.querySelector('.tt-coord').textContent = `坐标: (${found.x_min}~${found.x_max}, ${found.z_min}~${found.z_max})`;
        canvas.style.cursor = 'pointer';
      } else { tooltip.style.display = 'none'; canvas.style.cursor = dragging ? 'grabbing' : 'grab'; }
    });
    canvas.addEventListener('click', e => {
      // Check player entities first
      const pAreas = window._playerHitAreas || [];
      for (const pe of pAreas) { const dx = e.offsetX - pe._cx, dy = e.offsetY - pe._cy; if (Math.sqrt(dx * dx + dy * dy) < pe._r) {
        document.getElementById('modalTitle').innerHTML = '\uD83D\uDFE2 ' + pe.display_name;
        document.getElementById('modalBody').innerHTML = `<div class="section"><div class="section-label">在线玩家</div>${pe.display_name}</div>
          <div class="section"><div class="section-label">位置</div>${pe.sub_region || ''} · ${pe.region}<br>坐标: X${pe.x} / Y${pe.y} / Z${pe.z}</div>
          <div class="section"><div class="section-label">状态</div>${pe.status || 'idle'} · 世界日 ${pe.world_day || '--'}<br>${pe.current_action || '正在冒险中'}</div>
          <div class="section"><div class="section-label">最后活动</div>${(pe.last_heartbeat || '').slice(11, 19) || '--'}</div>
          <div class="section">
            <button onclick="jumpToAdventurer('${pe.entity_id}','${pe.display_name}')" style="background:#059669;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .15s" onmouseover="this.style.background='#10b981'" onmouseout="this.style.background='#059669'">\uD83D\uDC64 查看冒险者详情</button>
          </div>`;
        document.getElementById('modal').style.display = 'flex';
        return;
      }}
      let found = null; for (const p of pts) { if (!p._cx) continue; const dx = e.offsetX - p._cx, dy = e.offsetY - p._cz; if (Math.sqrt(dx * dx + dy * dy) < p._r) { found = p; break; } }
      if (found) {
        document.getElementById('modalTitle').textContent = found._label;
        document.getElementById('modalBody').innerHTML = `<div class="section"><div class="section-label">类型</div>${found.terrain_type}</div><div class="section"><div class="section-label">区域</div>${found.region}</div><div class="section"><div class="section-label">描述</div>${found.description}</div><div class="section"><div class="section-label">坐标</div>X: ${found.x_min}~${found.x_max}<br>Z: ${found.z_min}~${found.z_max}</div><div class="section"><div class="section-label">尺寸</div>${((found.x_max-found.x_min)/1000).toFixed(1)}km × ${((found.z_max-found.z_min)/1000).toFixed(1)}km</div>`;
        document.getElementById('modal').style.display = 'flex';
      }
    });
    canvas.addEventListener('mousedown', e => { dragging = true; dragX = e.offsetX - W/2 + (cx-(minX+maxX)/2)*zoom; dragY = e.offsetY - H/2 + (cz-(minZ+maxZ)/2)*zoom; });
    window.addEventListener('mousemove', e => { if (dragging) { dragX += e.movementX; dragY += e.movementY; draw(); } });
    window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'grab'; });
    canvas.addEventListener('wheel', e => { e.preventDefault(); const factor = e.deltaY < 0 ? 1.15 : 0.87; zoom *= factor; zoom = Math.max(initialZoom * 0.3, Math.min(initialZoom * 6, zoom)); draw(); });
    canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none' });

    window.mapZoom = (f) => { zoom *= f; zoom = Math.max(initialZoom * 0.3, Math.min(initialZoom * 6, zoom)); draw(); };
    window.mapReset = () => { zoom = initialZoom; cx = initialCx; cz = initialCz; dragX = 0; dragY = 0; draw(); };

    draw();

    // Periodic redraw for player pulse animation
    if (window._mapPulseInterval) clearInterval(window._mapPulseInterval);
    window._mapPulseInterval = setInterval(() => {
      const cvs = document.getElementById('mapCanvas');
      if (!cvs) { clearInterval(window._mapPulseInterval); return; }
      draw();
    }, 1500);
  }, 100);
}

function closeModal(){document.getElementById('modal').style.display='none'}

window.jumpToAdventurer = function(playerId, name) {
  closeModal();
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
  const advLink = document.querySelector('nav a[data-page="adventurers"]');
  if (advLink) advLink.classList.add('active');
  currentPage = 'adventurers';
  renderPage();
  document.getElementById('pageTitle').textContent = '冒险者 · ' + name;
};

window.updateMapDay = async function(day) {
  mapDay = parseInt(day);
  document.getElementById('mapDayLabel').textContent = mapDay>=99999 ? '全部' : mapDay;
  try {
    const r = await fetch(API+'/api/v1/world/map?world_day='+(mapDay>=99999?99999:mapDay));
    cachedMap = await r.json();
    renderPage();
  } catch(e){}
};

document.querySelectorAll('nav a').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
    a.classList.add('active');currentPage=a.dataset.page;renderPage();
  });
});
refresh();setInterval(refresh,30000);
</script>
